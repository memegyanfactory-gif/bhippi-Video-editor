<!doctype html>
<html><head><meta charset="utf-8"><title>Theo v2 rig prototype</title>
<style>html,body{margin:0;background:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}</style></head>
<body><div id="stage"></div>
<script>
// Theo v2 — constructor-kit construction (like commercial flat character kits):
//  * no per-part outlines: joints are hidden by same-colour overlap (sleeve over shoulder, hand over wrist)
//  * optional "outlined" style draws ONE merged outline per body group (shirt = torso+sleeves,
//    arm = upper+fore+hand, legs = pelvis+both legs), so there is never a line at a joint
//  * hands are a swap library of finished drawings; the wrist extends into the forearm
let OUT = 0; // outline px; 0 = flat
const BASE = { line:'#1E2022', skin:'#F7C8AE', skinShade:'#EBB294', skinLine:'#D9967A', blush:'#F29C8C', hair:'#2B1E1A', hairHi:'#4A342C',
  top:'#3F7FC1', topShade:'#346CA7', topLine:'#2B5C8F', collar:'#FFFFFF', collarShade:'#DDE6F0',
  bottom:'#2B3E50', bottomShade:'#223242', shoe:'#1A202C', sole:'#F2F2F2', eye:'#1A1414', mouth:'#8A3B2E',
  glass:'#2A2230', tabletFrame:'#1A202C', screen:'#EAF2FB', accent:'#F6A623', accent2:'#22C3A6' };
let P = BASE;
const V = { add:(a,b)=>[a[0]+b[0],a[1]+b[1]], sub:(a,b)=>[a[0]-b[0],a[1]-b[1]], mul:(a,k)=>[a[0]*k,a[1]*k],
  len:(a)=>Math.hypot(a[0],a[1]), lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t], norm:(a)=>{const l=Math.hypot(a[0],a[1])||1;return[a[0]/l,a[1]/l]} };
const f=(n)=>+n.toFixed(2);
const RIG = { pelvis:[0,-352], neck:[0,-598], shoulder:[[-56,-574],[56,-574]], hip:[[-24,-350],[24,-350]], upper:120, fore:108, thigh:166, shin:160 };

function twoBone(s,t,a,b,prefer){
  const d=V.sub(t,s); const dist=Math.max(Math.abs(a-b)+1e-3,Math.min(a+b-1e-3,V.len(d)));
  const base=Math.atan2(d[1],d[0]); const A=Math.acos(Math.max(-1,Math.min(1,(a*a+dist*dist-b*b)/(2*a*dist))));
  const j1=[s[0]+Math.cos(base+A)*a,s[1]+Math.sin(base+A)*a], j2=[s[0]+Math.cos(base-A)*a,s[1]+Math.sin(base-A)*a];
  return {joint:(j1[0]-j2[0])*prefer[0]+(j1[1]-j2[1])*prefer[1]>=0?j1:j2, end:[s[0]+Math.cos(base)*dist,s[1]+Math.sin(base)*dist]};
}
function limbCurve(s,j,e,bendy){const mid=V.lerp(s,e,.5);return{s,c:V.add(mid,V.mul(V.sub(j,mid),1+bendy)),e};}
const qAt=(q,t)=>{const u=1-t;return[u*u*q.s[0]+2*u*t*q.c[0]+t*t*q.e[0],u*u*q.s[1]+2*u*t*q.c[1]+t*t*q.e[1]]};
const qTan=(q,t)=>V.norm([2*(1-t)*(q.c[0]-q.s[0])+2*t*(q.e[0]-q.c[0]),2*(1-t)*(q.c[1]-q.s[1])+2*t*(q.e[1]-q.c[1])]);
function ribbon(q,t0,t1,w0,w1,capS='round',capE='round',n=20){
  const Ls=[],Rs=[];
  for(let i=0;i<=n;i++){const t=t0+(t1-t0)*i/n,p=qAt(q,t),tg=qTan(q,t),nm=[-tg[1],tg[0]],u=i/n,w=(w0+(w1-w0)*u)/2;Ls.push(V.add(p,V.mul(nm,w)));Rs.push(V.sub(p,V.mul(nm,w)));}
  const cap=(p,tg,w)=>{const o=[],a0=Math.atan2(tg[1],tg[0]);for(let k=1;k<10;k++){const a=a0+(Math.PI/2-Math.PI*k/10);o.push([p[0]+Math.cos(a)*w,p[1]+Math.sin(a)*w]);}return o;};
  let pts=[...Ls]; if(capE==='round')pts.push(...cap(qAt(q,t1),qTan(q,t1),w1/2));
  pts.push(...Rs.reverse()); if(capS==='round'){const tg=qTan(q,t0);pts.push(...cap(qAt(q,t0),[-tg[0],-tg[1]],w0/2));}
  return 'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L')+'Z';
}
const seg=(a,b,w0,w1,capS='round',capE='round')=>ribbon({s:a,c:V.lerp(a,b,.5),e:b},0,1,w0,w1,capS,capE,8);
// A body group: [outline pass for all shapes] then [fills in order] — one silhouette, no inner joint lines.
function grp(shapes,extra=''){
  const wrap=(s,inner)=>s.tf?`<g transform="${s.tf}">${inner}</g>`:inner;
  const o=OUT?shapes.filter(s=>!s.noOutline).map(s=>wrap(s,`<path d="${s.d}" fill="${P.line}" stroke="${P.line}" stroke-width="${2*OUT}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`)).join(''):'';
  return o+shapes.map(s=>wrap(s,`<path d="${s.d}" fill="${s.fill}" ${s.op?`opacity="${s.op}"`:''}/>`)).join('')+extra;
}
const ln=(d,w,col,tf)=>`<path ${tf?`transform="${tf}"`:''} d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;

// ---------- Hand library (hand space: wrist at 0,0, +y toward the fingertips; x mirrored per side)
function handShapes(kind){
  const S=P.skin, sh=[], det=[];
  const fist='M-13-16C-16-2-17 16-13 30C-9 38 9 38 13 30C17 18 16-2 12-16Z';
  const wristStub=seg([0,-26],[0,-4],17,20,'round','round');
  sh.push({d:wristStub,fill:S});
  if(kind==='open'){
    sh.push({d:'M-9-14C-12-4-15 8-15 18C-15 28-12 34-8 37H10C14 31 16 22 15 12C14 2 11-6 9-14Z',fill:S});
    [[[-10,32],[-13,58],7.6,6.6],[[-3,34],[-3,65],7.8,6.8],[[4,34],[6,63],7.6,6.6],[[10,30],[15,54],7,6]].forEach(([a,b,w0,w1])=>sh.push({d:seg(a,b,w0,w1),fill:S}));
    sh.push({d:ribbon({s:[-11,4],c:[-22,10],e:[-27,24]},0,1,10,8),fill:S});
    det.push(ln('M-6 18Q0 24 8 20',1.3,P.skinLine));
  } else if(kind==='grip'){
    sh.push({d:fist,fill:S}); sh.push({d:ribbon({s:[11,-2],c:[20,6],e:[20,20]},0,1,10,9),fill:S});
    det.push(ln('M-10 20Q0 25 10 20',1.4,P.skinLine)+ln('M-9 28Q0 32 9 28',1.4,P.skinLine));
  } else if(kind==='point'){
    sh.push({d:'M-13-16C-16-2-17 12-13 24C-9 30 9 30 13 24C17 14 16-2 12-16Z',fill:S});
    sh.push({d:seg([-6,20],[-8,62],8.4,7.2),fill:S}); sh.push({d:ribbon({s:[12,-4],c:[14,8],e:[4,16]},0,1,10,9),fill:S});
    det.push(ln('M-1 22Q5 26 10 22',1.3,P.skinLine));
  } else if(kind==='peace'){
    sh.push({d:'M-13-16C-16-2-17 12-13 24C-9 30 9 30 13 24C17 14 16-2 12-16Z',fill:S});
    sh.push({d:seg([-7,20],[-14,60],8.2,7),fill:S}); sh.push({d:seg([1,20],[5,62],8.2,7),fill:S});
    sh.push({d:ribbon({s:[12,-4],c:[14,8],e:[5,16]},0,1,10,9),fill:S});
    det.push(ln('M6 22Q9 25 12 22',1.3,P.skinLine));
  } else if(kind==='thumb'){
    sh.push({d:fist,fill:S}); sh.push({d:seg([8,22],[9,50],11,10),fill:S});
    det.push(ln('M-11 6H6M-11 14H6M-11 22H4',1.4,P.skinLine));
  } else if(kind==='phone'){
    sh.push({d:fist,fill:S});
    det.push(`<g transform="rotate(-8)"><rect x="-16" y="4" width="34" height="58" rx="6" fill="${P.tabletFrame}"/><rect x="-13" y="9" width="28" height="48" rx="3" fill="${P.screen}"/><rect x="-9" y="14" width="18" height="4" rx="2" fill="${P.accent}"/><rect x="-9" y="22" width="12" height="4" rx="2" fill="#C9D6E6"/></g>`);
    det.push(`<path d="${ribbon({s:[12,6],c:[14,20],e:[8,30]},0,1,10,9)}" fill="${S}"/>`);
  }
  return {sh,det:det.join('')};
}

// ---------- Face + head, parameterised by the character's look (hair, glasses, age, lashes…)
function backHair(o){const F=o.face||{};return F.hair==='long'?grp([{d:'M-50-700C-58-742-30-760 0-760C30-760 58-742 50-700C56-650 58-610 46-580C26-574-26-574-46-580C-58-610-56-650-50-700Z',fill:P.hair}]):'';}
function headGroup(o){
  const e=o.expr||'smile', lk=o.look||[0,0], F=o.face||{};
  const hair=F.hair||'quiff';
  const face='M-43-690C-44-724-22-736 0-736C24-736 44-724 43-690C43-662 34-636 14-627C6-624-6-624-14-627C-34-636-43-662-43-690Z';
  let s='';
  // back hair (behind the face): long, ponytail, bun
  if(hair==='pony') s+=grp([{d:ribbon({s:[30,-730],c:[70,-720],e:[58,-640]},0,1,26,12),fill:P.hair}]);
  if(hair==='bun') s+=grp([{d:'M-22-760A22 20 0 1 1 22-760A22 20 0 1 1-22-760Z',fill:P.hair}]);
  s+=grp([
    {d:'M-14-640V-590Q0-580 14-590V-640Z',fill:P.skin},
    {d:'M-41-688C-53-692-56-672-49-664C-46-660-42-661-40-663Z',fill:P.skin},{d:'M41-688C53-692 56-672 49-664C46-660 42-661 40-663Z',fill:P.skin},
    {d:face,fill:P.skin}]);
  s+=`<path d="M-14-630Q0-614 14-630V-612Q0-600-14-612Z" fill="${P.skinShade}"/>`;
  s+=`<clipPath id="fc${o.id}"><path d="${face}"/></clipPath><path clip-path="url(#fc${o.id})" d="M6-740C12-700 16-660 4-620H60V-740Z" fill="${P.skinShade}" opacity=".55"/>`;
  s+=`<ellipse cx="-27" cy="-662" rx="9" ry="5" fill="${P.blush}" opacity="${F.blush||.35}"/><ellipse cx="27" cy="-662" rx="9" ry="5" fill="${P.blush}" opacity="${F.blush||.35}"/>`;
  // front hair
  const H={
    quiff:'M-46-686C-54-722-34-752 0-754C26-756 42-744 47-726C52-712 50-698 46-686C44-698 40-706 34-712C20-700-4-704-18-716C-26-706-36-698-46-686Z',
    long:'M-46-680C-54-724-30-754 2-754C34-754 54-726 46-680C42-700 34-714 22-722C6-706-18-704-34-712C-40-704-44-694-46-680Z',
    pony:'M-45-684C-52-724-28-752 2-752C32-752 52-728 45-684C42-702 30-716 14-720C0-714-24-712-36-706C-40-700-43-692-45-684Z',
    bun:'M-45-688C-50-726-26-748 0-748C26-748 50-726 45-688C40-708 24-722 0-724C-24-722-40-708-45-688Z',
    kid:'M-47-684C-56-726-30-756 2-756C34-756 56-730 47-684C46-696 42-704 36-708L30-700L24-712L14-702L6-714L-4-702L-12-714L-22-702L-30-710L-38-700C-42-696-45-690-47-684Z',
    bald:'M-46-676C-50-694-48-708-42-716C-40-704-40-694-42-676ZM46-676C50-694 48-708 42-716C40-704 40-694 42-676Z',
  };
  s+=grp([{d:H[hair],fill:P.hair}]);
  if(hair==='quiff') s+=ln('M-6-744Q14-750 30-734',3,P.hairHi);
  if(hair==='long'||hair==='pony') s+=ln('M-20-740Q6-750 30-736',3,P.hairHi);
  if(F.age==='old') s+=ln('M-18-722Q0-726 18-722',1.6,P.skinLine)+ln('M-40-676Q-37-672-33-672',1.4,P.skinLine)+ln('M40-676Q37-672 33-672',1.4,P.skinLine)+ln('M-24-650Q-22-640-16-636',1.4,P.skinLine)+ln('M24-650Q22-640 16-636',1.4,P.skinLine);
  const by=e==='happy'?-712:-708;
  s+=ln(`M-30 ${by}Q-21 ${by-5}-11 ${by-1}`,F.thinBrows?2.4:3.6,P.brow||P.hair)+ln(`M30 ${by}Q21 ${by-5} 11 ${by-1}`,F.thinBrows?2.4:3.6,P.brow||P.hair);
  const er=F.bigEyes?1.35:1;
  [-19,19].forEach(x=>{
    if(o.blink) s+=ln(`M${x-6}-686Q${x}-683 ${x+6}-686`,2.6,P.eye);
    else if(e==='happy') s+=ln(`M${x-6}-684Q${x}-692 ${x+6}-684`,2.8,P.eye);
    else s+=`<ellipse cx="${x+lk[0]}" cy="${-686+lk[1]}" rx="${4.4*er}" ry="${5.4*er}" fill="${P.eye}"/><circle cx="${x+lk[0]+1.6*er}" cy="${-688.5+lk[1]}" r="${1.5*er}" fill="#fff"/>`;
    if(F.lashes && !o.blink && e!=='happy') s+=ln(`M${x+(x<0?-4:4)}-691L${x+(x<0?-8:8)}-692`,1.8,P.eye);
  });
  if(F.glasses!==false) s+=`<g fill="none" stroke="${P.glass}" stroke-width="2.6" vector-effect="non-scaling-stroke"><circle cx="-19" cy="-686" r="13.5"/><circle cx="19" cy="-686" r="13.5"/><path d="M-5.5-688Q0-692 5.5-688M-32.5-688L-41-692M32.5-688L41-692"/></g>`;
  s+=`<path d="M-1-672Q5-660-3-656Q-6-656-7-658" fill="none" stroke="${P.skinLine}" stroke-width="2.4" stroke-linecap="round"/>`;
  if(F.mustache) s+=`<path d="M-18-644C-12-654-2-652 0-648C2-652 12-654 18-644C12-646 4-644 0-642C-4-644-12-646-18-644Z" fill="${P.hair}"/>`;
  if(e==='happy') s+=`<path d="M-15-646Q0-642 15-646Q12-630 0-629Q-12-630-15-646Z" fill="${P.mouth}"/><path d="M-12-645Q0-642 12-645V-641Q0-638-12-641Z" fill="#fff"/><path d="M-7-633Q0-630 7-633Q4-629 0-629Q-4-629-7-633Z" fill="#E86B6B"/>`;
  else if(F.lips) s+=`<path d="M-11-645Q-5-649 0-646Q5-649 11-645Q6-637 0-637Q-6-637-11-645Z" fill="${P.lips||'#C8505A'}"/>`;
  else s+=ln('M-11-645Q0-637 11-645',2.8,P.mouth);
  return s;
}

function tablet(c,ang,sc=1){
  const w=158*sc,h=108*sc,r=10;
  let s=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${r}" fill="${P.tabletFrame}"/><rect x="${-w/2+8}" y="${-h/2+8}" width="${w-16}" height="${h-16}" rx="4" fill="${P.screen}"/>`;
  const bx=-w/2+20,by=h/2-18;
  [[0,.45,P.top],[1,.7,P.accent],[2,.55,P.top],[3,.9,P.accent2]].forEach(([i,k,c])=>{s+=`<rect x="${bx+i*16}" y="${by-k*52*sc}" width="10" height="${k*52*sc}" rx="2" fill="${c}"/>`;});
  s+=`<circle cx="${w/2-38}" cy="-4" r="${20*sc}" fill="none" stroke="#C9D6E6" stroke-width="7"/><circle cx="${w/2-38}" cy="-4" r="${20*sc}" fill="none" stroke="${P.accent}" stroke-width="7" stroke-dasharray="80 200" transform="rotate(-90 ${w/2-38} -4)"/>`;
  s+=`<rect x="${-w/2+20}" y="${-h/2+18}" width="52" height="6" rx="3" fill="#C9D6E6"/>`;
  if(OUT) s=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="${P.line}" stroke-width="${2*OUT}" vector-effect="non-scaling-stroke"/>`+s;
  return `<g transform="translate(${f(c[0])} ${f(c[1])}) rotate(${f(ang)})">${s}</g>`;
}

const POSES = {
  hold:   { hands:[[-72,-428],[74,-436]], fs:[.4,.4], hk:['grip','grip'], tablet:{c:[0,-440],a:-5}, tilt:0, expr:'smile' },
  present:{ hands:[[-80,-384],[196,-548]], hk:['grip','open'], tablet:{c:[-94,-318],a:86,sc:.86}, tilt:3, expr:'smile', look:[2,0] },
  wave:   { hands:[[-80,-384],[124,-756]], hk:['grip','open'], tablet:{c:[-94,-318],a:86,sc:.86}, tilt:4, expr:'happy' },
  point:  { hands:[[-80,-384],[200,-600]], hk:['grip','point'], tablet:{c:[-94,-318],a:86,sc:.86}, tilt:2, expr:'smile', look:[3,-1] },
  cane:   { hands:[[-74,-360],[92,-300]], hk:['grip','grip'], tablet:null, tilt:5, expr:'smile' },
  thumbs: { hands:[[-80,-372],[112,-530]], hk:['grip','thumb'], tablet:null, tilt:-3, expr:'happy' },
  open:   { hands:[[-80,-372],[196,-548]], hk:['grip','open'], tablet:null, tilt:3, expr:'happy' },
  hiwave: { hands:[[-80,-372],[124,-756]], hk:['grip','open'], tablet:null, tilt:4, expr:'happy' },
  phone:  { hands:[[-84,-372],[40,-560]], fs:[1,.55], hk:['open','phone'], tablet:null, tilt:6, expr:'smile', look:[1,2] },
};
function blendPose(a,b,k){
  const out={...(k<.5?a:b)}; out.hands=[V.lerp(a.hands[0],b.hands[0],k),V.lerp(a.hands[1],b.hands[1],k)]; out.tilt=a.tilt+(b.tilt-a.tilt)*k;
  const fa=a.fs||[1,1],fb=b.fs||[1,1]; out.fs=[fa[0]+(fb[0]-fa[0])*k,fa[1]+(fb[1]-fa[1])*k];
  if(a.tablet&&b.tablet) out.tablet={c:V.lerp(a.tablet.c,b.tablet.c,k),a:a.tablet.a+(b.tablet.a-a.tablet.a)*k,sc:(a.tablet.sc||1)+((b.tablet.sc||1)-(a.tablet.sc||1))*k};
  return out;
}

let uid=0;
function character(pose,o={}){
  P={...BASE,...(o.palette||{})}; OUT=o.outline||0; const id=++uid; const B=o.body||{}; const bsz=B.s||1;
  let s=`<ellipse cx="0" cy="4" rx="${110*bsz}" ry="13" fill="#1E2022" opacity=".10"/><g transform="scale(${bsz})">`;
  // legs + pelvis: one group
  const legs=[0,1].map(i=>{const hip=RIG.hip[i],ank=[i?30:-30,-30];return{hip,...twoBone(hip,ank,RIG.thigh,RIG.shin,[i?1:-1,0])};});
  const legSh=legs.map((lg,i)=>({d:ribbon(limbCurve(lg.hip,lg.joint,lg.end,.4),0,1,B.dress?36:50,B.dress?26:38,'round','flat'),fill:B.dress?P.legs:P.bottom}));
  if(!B.dress) legSh.push({d:'M-52-378H52C54-352 54-332 48-312C28-306 12-306 0-302C-12-306-28-306-48-312C-54-332-54-352-52-378Z',fill:P.bottom});
  s+=grp(legSh, B.dress?'':legs.map((lg,i)=>`<path d="${ribbon(limbCurve(lg.hip,lg.joint,lg.end,.4),.1,1,12,9,'flat','flat')}" transform="translate(${i?-13:13} 0)" fill="${P.bottomShade}"/>`).join('')
       + (B.dress?'':legs.map((lg,i)=>ln(`M${f(lg.end[0]-19)} -40H${f(lg.end[0]+19)}`,2,P.bottomShade)).join('')));
  // shoes (sneaker: dark upper + light sole)
  legs.forEach((lg,i)=>{const sx=i?1:-1,x=lg.end[0];
    s+=grp([{d:`M${x+sx*-20} -34C${x+sx*-26} -14 ${x+sx*-24} -2 ${x+sx*-14} -2H${x+sx*36}C${x+sx*46} -2 ${x+sx*46} -14 ${x+sx*30} -20C${x+sx*16} -26 ${x+sx*12} -32 ${x+sx*8} -36Z`,fill:P.shoe}],
      `<path d="M${x+sx*-22} -8H${x+sx*42}C${x+sx*44} -4 ${x+sx*42} 0 ${x+sx*36} 0H${x+sx*-14}C${x+sx*-20} 0 ${x+sx*-22} -4 ${x+sx*-22} -8Z" fill="${P.sole}"/>`);});
  if(B.dress) s+=grp([{d:'M-56-380H56C64-330 76-270 86-222C40-210-40-210-86-222C-76-270-64-330-56-380Z',fill:P.top}],`<path d="M30-380C44-320 56-270 62-214L86-222C76-270 64-330 56-380Z" fill="${P.topShade}"/>`+ln('M-20-300Q-24-260-30-226',1.6,P.topLine)+ln('M22-300Q26-260 32-226',1.6,P.topLine));
  // upper body (breathing = tiny chest scale)
  const bs=1+(o.breath||0)*0.012;
  s+=`<g transform="rotate(${B.lean||0} 0 -352) translate(0 -352) scale(1 ${f(bs)}) translate(0 352)">`;
  const arms=[0,1].map(i=>{const sh=RIG.shoulder[i];return{sh,...twoBone(sh,pose.hands[i],RIG.upper,RIG.fore*((pose.fs||[1,1])[i]),[i?1:-1,.35])};});
  const aq=arms.map(a=>limbCurve(a.sh,a.joint,a.end,.7));
  const sleeve=(q)=>ribbon(q,-.04,.34,38,35,'round','flat');
  s+=`<g transform="rotate(${f(pose.tilt||0)} 0 -598) translate(0 -598) scale(${f((B.head||1)/bsz)}) translate(0 598)">`+backHair({face:o.face})+'</g>';
  // shirt group: torso + both sleeves share ONE outline → no seam at the shoulders
  const torso='M-58-592C-68-586-70-566-68-546C-64-476-60-406-56-330C-30-322 30-322 56-330C60-406 64-476 68-546C70-566 68-586 58-592C38-600 20-604 0-604C-20-604-38-600-58-592Z';
  s+=grp([{d:torso,fill:P.top},...aq.map(q=>({d:sleeve(q),fill:P.top}))],
    `<clipPath id="tc${id}"><path d="${torso}"/></clipPath><path clip-path="url(#tc${id})" d="M24-610C38-520 42-420 38-300H90V-610Z" fill="${P.topShade}"/>`+
    ln('M0-580V-528',2,P.topLine)+`<circle cx="0" cy="-562" r="2.4" fill="${P.topLine}"/><circle cx="0" cy="-544" r="2.4" fill="${P.topLine}"/>`+
    ln('M-44-470Q-40-430-44-396',1.6,P.topLine)+ln('M40-360Q30-352 20-356',1.6,P.topLine));
  // head (neck + face + ears one group), collar over the neck
  const hs=(B.head||1)/bsz; s+=`<g transform="rotate(${f(pose.tilt||0)} 0 -598) translate(0 -598) scale(${f(hs)}) translate(0 598)">`+headGroup({id,expr:o.expr||pose.expr,look:pose.look,blink:o.blink,face:o.face})+'</g>';
  s+=grp([{d:'M-24-600L0-584L-10-566L-32-592Z',fill:P.collar},{d:'M24-600L0-584L10-566L32-592Z',fill:P.collar}],`<path d="M-10-566L0-584L10-566L4-570L0-578L-4-570Z" fill="${P.collarShade}"/>`);
  if(pose.tablet&&!o.noTablet) s+=tablet(pose.tablet.c,pose.tablet.a,pose.tablet.sc||1);
  if(o.cane) s+=grp([{d:seg([pose.hands[1][0]+10,pose.hands[1][1]+20],[pose.hands[1][0]+18,-2],10,10),fill:'#6B4A2E'},{d:ribbon({s:[pose.hands[1][0]-12,pose.hands[1][1]+26],c:[pose.hands[1][0]-2,pose.hands[1][1]+2],e:[pose.hands[1][0]+12,pose.hands[1][1]+22]},0,1,10,10),fill:'#6B4A2E'}]);
  // arms: upper + fore + hand in ONE group (no wrist/elbow lines); starts inside the sleeve
  arms.forEach((a,i)=>{
    const q=aq[i], tg=qTan(q,.98), ang=Math.atan2(tg[0],tg[1])*-180/Math.PI, side=i?-1:1;
    const {sh,det}=handShapes(pose.hk[i]);
    const tf=`translate(${f(a.end[0])} ${f(a.end[1])}) rotate(${f(ang)}) scale(${side} 1)`;
    s+=grp([{d:ribbon(q,.16,.99,23,16,'round','round'),fill:P.skin},...sh.map(x=>({...x,tf}))],`<g transform="${tf}">${det}</g>`);
  });
  // sleeves re-filled on top (covers where the arm starts), with a hem line + underside shade
  aq.forEach((q,i)=>{
    const p=qAt(q,.34),t=qTan(q,.34),n=[-t[1],t[0]];
    s+=`<path d="${sleeve(q)}" fill="${P.top}"/><path d="${ribbon(q,.05,.34,14,14,'flat','flat')}" transform="translate(${f(n[0]*(i?-11:11))} ${f(n[1]*(i?-11:11))})" fill="${P.topShade}" opacity=".8"/>`;
    s+=ln(`M${f(p[0]+n[0]*17)} ${f(p[1]+n[1]*17)}L${f(p[0]-n[0]*17)} ${f(p[1]-n[1]*17)}`,OUT?OUT:2,OUT?P.line:P.topLine);
  });
  s+='</g></g>';
  return s;
}

// ---------- Sheet
function panel(x,y,w,h,title,sub,inner,scale=.72,bg='#F4F7FB'){
  return `<g transform="translate(${x} ${y})"><rect width="${w}" height="${h}" rx="18" fill="${bg}"/>
   <text x="24" y="40" font-size="22" font-weight="700" fill="#1E2022">${title}</text><text x="24" y="66" font-size="15" fill="#5B6573">${sub}</text>
   <g transform="translate(${w/2} ${h-30}) scale(${scale})">${inner}</g></g>`;
}
window.renderSheet=function(){
  const W=1680,H=980;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#fff"/>`;
  s+=`<text x="24" y="52" font-size="34" font-weight="800" fill="#1E2022">The cast — six characters, one rig</text>`;
  s+=`<text x="24" y="84" font-size="17" fill="#5B6573">same skeleton, IK, hand library and face kit · each character = body params + hair + outfit + palette + face options · all original designs</text>`;
  s+=`<rect x="16" y="104" width="${W-32}" height="${H-120}" rx="18" fill="#F4F7FB"/><rect x="16" y="${H-190}" width="${W-32}" height="174" rx="0" fill="#E7EEF6"/>`;
  const cast=[
    ['Walter','older man · cane · stoop 5°',POSES.cane,{body:{s:.95,lean:5},cane:1,face:{hair:'bald',mustache:1,age:'old'},palette:{skin:'#F2C4A8',skinShade:'#E3AD8F',hair:'#D9D9D9',brow:'#BDBDBD',top:'#8A6E52',topShade:'#765C43',topLine:'#5E4935',collar:'#EDE6DA',bottom:'#5B6B7A',bottomShade:'#4C5A67'}}],
    ['Rosa','older woman · bun · dress',POSES.open,{body:{s:.9,dress:1},noTablet:1,face:{hair:'bun',age:'old',lips:1,thinBrows:1},palette:{skin:'#8D5A3B',skinShade:'#7A4B31',skinLine:'#6A3F28',blush:'#B0564A',hair:'#E6E6E6',brow:'#CFCFCF',top:'#2E8B7A',topShade:'#257366',topLine:'#1D5C52',collar:'#F3F0E8',collarShade:'#DDD8CC',legs:'#6E4A36',lips:'#9C3F3A'}}],
    ['Theo','presenter · tablet · polo',POSES.hold,{}],
    ['Maya','young woman · long hair · dress',POSES.present,{body:{s:.95,dress:1},face:{hair:'long',glasses:false,lashes:1,lips:1,thinBrows:1},palette:{skin:'#E9B08E',skinShade:'#D99A78',skinLine:'#C4805F',hair:'#3A2320',hairHi:'#5A3A33',top:'#7B5CD6',topShade:'#6848BF',topLine:'#553AA0',collar:'#7B5CD6',collarShade:'#6848BF',legs:'#E9B08E'}}],
    ['Leo','boy · big head ratio · tee',POSES.hiwave,{body:{s:.6,head:.9},face:{hair:'kid',glasses:false,bigEyes:1},palette:{skin:'#C98E69',skinShade:'#B67A56',skinLine:'#9E6444',hair:'#1A1414',top:'#22C3A6',topShade:'#1CA68D',topLine:'#168571',collar:'#22C3A6',collarShade:'#1CA68D',bottom:'#3B4A6B',bottomShade:'#2F3C58'}}],
    ['Ava','girl · ponytail · dress',POSES.thumbs,{body:{s:.56,head:.86,dress:1},face:{hair:'pony',glasses:false,bigEyes:1,lashes:1},palette:{hair:'#8A4B2A',hairHi:'#A9623C',top:'#F6A623',topShade:'#DC8F14',topLine:'#B7760F',collar:'#FFFFFF',legs:'#F7C8AE'}}],
  ];
  cast.forEach(([name,sub,pose,o],i)=>{const x=150+i*276;
    s+=`<g transform="translate(${x} ${H-128}) scale(.95)">${character(pose,o)}</g>`;
    s+=`<text x="${x}" y="${H-70}" text-anchor="middle" font-size="22" font-weight="700" fill="#1E2022">${name}</text><text x="${x}" y="${H-44}" text-anchor="middle" font-size="14" fill="#5B6573">${sub}</text>`;});
  s+='</svg>'; document.getElementById('stage').innerHTML=s;
};

const easeOutBack=(x,c=1.7)=>1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);
const easeInOut=(x)=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const clamp=(x)=>Math.max(0,Math.min(1,x));
window.renderFrame=function(t){
  const W=1080,H=1080;
  const pop=easeOutBack(clamp(t/0.47));
  let pose=POSES.hold, expr='smile';
  const wIn=clamp((t-1.25)/0.35), wOut=clamp((t-2.9)/0.35), pIn=clamp((t-3.55)/0.4);
  if(t>=1.25&&t<2.9){const wv={...POSES.wave,hands:[POSES.wave.hands[0],V.add(POSES.wave.hands[1],[26*Math.sin((t-1.25)*2*Math.PI*2.4),4*Math.cos((t-1.25)*2*Math.PI*4.8)])]};pose=blendPose(POSES.hold,wv,easeOutBack(wIn,1.2));expr=wIn>.4?'happy':'smile';}
  else if(t>=2.9&&t<3.55){pose=blendPose(POSES.wave,POSES.hold,easeInOut(wOut));expr=wOut<.5?'happy':'smile';}
  else if(t>=3.55){pose=blendPose(POSES.hold,POSES.point,easeOutBack(pIn,1.2));}
  const blink=(t>0.9&&t<0.98)||(t>3.3&&t<3.38);
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#EAF1F8"/>`;
  s+=`<circle cx="540" cy="560" r="${360*clamp(easeOutBack(clamp((t-0.05)/0.5),1.4))}" fill="#DCE7F3"/>`;
  s+=`<g transform="translate(540 ${H-140}) scale(${0.98*pop})">${character(pose,{breath:Math.sin(t*2*Math.PI/3.2),blink,expr})}</g></svg>`;
  document.getElementById('stage').innerHTML=s;
};
if(location.hash==='#anim'){let t0=performance.now();const loop=()=>{renderFrame(((performance.now()-t0)/1000)%4.5);requestAnimationFrame(loop)};loop();}
else renderSheet();
</script></body></html>
