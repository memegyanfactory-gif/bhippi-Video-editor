<meta charset="utf-8">
<title>Character Studio 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--app:#1a1a1a;--seam:#0f0f0f;--panel:#232323;--panel-2:#282828;--panel-3:#2f2f2f;--panel-4:#3a3a3a;--field:#1b1b1b;--line-strong:#3d3d3d;
  --text:#dcdcdc;--text-dim:#a9a9a9;--text-faint:#767676;--blue:#2d8ceb;--blue-hi:#4ea3ff;--blue-soft:rgba(45,140,235,.16);--blue-line:rgba(45,140,235,.6);--red:#ff6b6b;--green:#3fb950;--radius:4px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--display:"Fredoka","Inter",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--app);color:var(--text);font:13px/1.45 var(--font);overflow:hidden}
button,select,textarea{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--blue-hi);outline-offset:1px}
.app{height:100%;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--seam);flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;background:var(--panel-3);border:1px solid var(--line-strong);border-radius:var(--radius);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-4)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.brand{display:flex;align-items:center;gap:8px;font:600 15px var(--display)}
.modes{display:flex;gap:2px;margin-left:12px;background:var(--field);border:1px solid var(--line-strong);border-radius:6px;padding:2px}
.modes button{background:none;border:0;padding:5px 14px;border-radius:4px;cursor:pointer;color:var(--text-dim)}
.modes button.on{background:var(--panel-4);color:var(--text)}
.hint{margin-left:auto;color:var(--text-faint);font-size:12px}
.body{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr}
.side{background:var(--panel);border-right:1px solid var(--seam);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.side h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.row{display:flex;flex-direction:column;gap:6px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;width:max-content;max-width:100%}
.seg button{background:var(--panel-3);border:0;color:var(--text-dim);padding:4px 9px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}.seg button.on{background:var(--blue-soft);color:var(--text)}
.sw{display:flex;gap:5px;flex-wrap:wrap}.sw button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}.sw button.on{border-color:var(--blue-hi)}
select{height:28px;background:var(--field);border:1px solid var(--line-strong);border-radius:var(--radius);padding:0 6px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mv{text-align:left;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:6px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mv b{font-family:var(--mono);font-size:12px;color:var(--blue-hi);font-weight:500}.mv span{color:var(--text-dim);font-size:11px;line-height:1.4}
.mv.on{border-color:var(--blue-line);background:var(--blue-soft)}
textarea{width:100%;min-height:300px;resize:vertical;background:var(--field);border:1px solid var(--line-strong);border-radius:4px;padding:8px;font:12px/1.5 var(--mono);color:#cfe3ff}
.errs{display:flex;flex-direction:column;gap:4px}.errs div{color:var(--red);font-size:12px}.ok{color:var(--green);font-size:12px}
pre{margin:0;max-height:260px;overflow:auto;background:var(--field);border:1px solid var(--line-strong);border-radius:4px;padding:8px;font:11px/1.45 var(--mono);color:#cfe3ff;white-space:pre-wrap}
details summary{cursor:pointer;color:var(--text-dim)}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--seam)}
.stage{flex:1;min-height:0;position:relative;background:linear-gradient(#F3ECFA,#E4D8F2 62%,#D8CAEB);overflow:hidden;cursor:grab;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;left:12px;top:10px;font:600 22px var(--display);color:#3b2d4a}
.sub{position:absolute;left:12px;top:40px;color:#6a5a7c;font-size:12px}
.tl{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel-2);border-top:1px solid var(--seam)}
.tl input[type=range]{flex:1;accent-color:var(--blue)}
.time{font-variant-numeric:tabular-nums;color:var(--text-dim);min-width:92px;text-align:right}
@media (max-width:900px){body{overflow:auto}.app{height:auto}.body{grid-template-columns:1fr}.stage{height:60vh;flex:none}}
</style>
<div class="app">
  <header class="hdr">
    <button class="btn" id="home" title="Back to Home">← Home</button>
    <div class="brand"><svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A5B"/><stop offset="1" stop-color="#8A5CF6"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#lg)"/><path d="M11 44c1-9 6-14 13-14s12 5 13 14Z" fill="#FFF3E6"/><circle cx="24" cy="21" r="9.5" fill="#FFE0CC"/><path d="M14 20c-1-8 5-12 10-12 7 0 11 4 10 11-2-3-5-5-9-4-4 1-7 0-8-2-1 3-2 5-3 7Z" fill="#3B2419"/><path d="M34 34l6-3v8l-6-3z" fill="#FFF3E6"/></svg>Character Studio 3D</div>
    <nav class="modes" id="modes"><button data-m="char" class="on">Character</button><button data-m="moves">Moves</button><button data-m="shots">Shots</button></nav>
    <span class="hint" id="hint">Drag to orbit · move the pointer to make them look</span>
  </header>
  <div class="body">
    <aside class="side" id="side"></aside>
    <main class="center">
      <div class="stage" id="stage"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="cap" id="cap"></div><div class="sub" id="sub"></div></div>
      <div class="tl"><button class="btn" id="play">Pause</button><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline"><span class="time" id="time">0.00 s</span>
        <span class="seg"><button id="twos" class="on">On twos</button><button id="ones">On ones</button></span></div>
    </main>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="text/plain" id="app-toon3d">
// Toon3D: 3D characters that read as hand-drawn animation.
// Real meshes + perspective camera (so things can rush the lens, get grabbed, swing), rendered with
// stepped toon lighting and inverted-hull ink lines whose weight follows the light and boils per drawing.
// Characters are built from the same CharacterSpec the Character room edits.
(function(){
const T=THREE, V3=(x,y,z)=>new T.Vector3(x,y,z), TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
function hex(c){return new T.Color(c);}
function mixc(a,b,k){return hex(a).lerp(hex(b),k);}
const INKC='#231421';

// ---------------- materials ----------------
const LIGHT=V3(-.55,.72,.42).normalize();
const shared={seed:{value:0},light:{value:LIGHT}};
function toon(color,opt={}){
  const base=hex(color),sh=opt.shade?hex(opt.shade):base.clone().lerp(hex('#3a1f4a'),.34);
  return new T.ShaderMaterial({
    uniforms:{uBase:{value:base},uShade:{value:sh},uLight:shared.light,uMap:{value:opt.map||null},uHasMap:{value:opt.map?1:0},uGloss:{value:opt.gloss||0},uSeed:shared.seed},
    vertexShader:`varying vec3 vN;varying vec2 vUv;varying vec3 vW;void main(){vUv=uv;vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader:`uniform vec3 uBase;uniform vec3 uShade;uniform vec3 uLight;uniform sampler2D uMap;uniform float uHasMap;uniform float uGloss;uniform float uSeed;varying vec3 vN;varying vec2 vUv;varying vec3 vW;
      float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719))+uSeed*1.37)*43758.5453);}
      void main(){vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;float d=dot(n,uLight);
        float edge=.06+(h(floor(vW*40.))-.5)*.05; float lit=smoothstep(edge-.015,edge+.015,d);
        vec3 b=uBase,s=uShade;if(uHasMap>.5){vec4 t=texture2D(uMap,vUv);b=t.rgb;s=mix(t.rgb,vec3(.23,.12,.29),.34);}
        vec3 c=mix(s,b,lit);
        if(uGloss>0.){float g=smoothstep(.78,.8,d)*uGloss;c=mix(c,vec3(1.),g*.35);}
        if(!gl_FrontFacing)c=s*.85;
        gl_FragColor=vec4(c,1.);
        #include <colorspace_fragment>
      }`,
    side:opt.double?T.DoubleSide:T.FrontSide});
}
function inkMat(width,color){
  return new T.ShaderMaterial({uniforms:{uW:{value:width},uC:{value:hex(color||INKC)},uSeed:shared.seed,uBoil:{value:1}},
    vertexShader:`uniform float uW;uniform float uSeed;uniform float uBoil;
      float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719))+uSeed*1.37)*43758.5453);}
      float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=h(i),b=h(i+vec3(1,0,0)),c=h(i+vec3(0,1,0)),d=h(i+vec3(1,1,0));float e=h(i+vec3(0,0,1)),g=h(i+vec3(1,0,1)),k=h(i+vec3(0,1,1)),l=h(i+vec3(1,1,1));
        return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,g,f.x),mix(k,l,f.x),f.y),f.z);}
      void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vec3 n=normalize(normalMatrix*normal);
        vec3 wn=normalize(mat3(modelMatrix)*normal);float sh=clamp(dot(n.xy,normalize(vec2(.45,-.9))),-1.,1.);
        float w=uW*(.35+1.25*pow(max(0.,sh+.15)/1.15,.9)+ (n3(position*9.)-.5)*.7*uBoil + (n3(position*2.3+uSeed)-.5)*.35);
        w=max(w,uW*.05);mv.xyz+=n*w*(-mv.z)*.0062;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform vec3 uC;void main(){gl_FragColor=vec4(uC,1.);
#include <colorspace_fragment>
}`,side:T.BackSide});
}
function withInk(mesh,width=1,color){const o=new T.Mesh(mesh.geometry,inkMat(width,color));o.renderOrder=-1;mesh.add(o);return mesh;}

// ---------------- geometry builders ----------------
// lathe of elliptical rings: slices [{y,a,b,z0,x0}], optional angular range [a0,a1] (open jacket), uv: u=angle, v=y
function latheGeo(S,N=28,range=null,uvY=null){
  const pos=[],uv=[],idx=[];const a0=range?range[0]:-Math.PI,a1=range?range[1]:Math.PI,closed=!range;const cols=closed?N:N+1;
  S.forEach((q,j)=>{for(let i=0;i<cols;i++){const al=a0+(a1-a0)*i/N;pos.push((q.x0||0)+q.a*Math.sin(al),q.y,(q.z0||0)+q.b*Math.cos(al));uv.push((al+Math.PI)/TAU,uvY?uvY(q.y):j/(S.length-1));}});
  for(let j=0;j<S.length-1;j++)for(let i=0;i<(closed?N:N);i++){const i2=closed?(i+1)%N:i+1;const A=j*cols+i,B=j*cols+i2,Cc=(j+1)*cols+i,D=(j+1)*cols+i2;idx.push(A,Cc,B,B,Cc,D);}
  if(closed){[0,S.length-1].forEach((j,k)=>{const q=S[j];const c=pos.length/3;pos.push(q.x0||0,q.y,q.z0||0);uv.push(.5,uvY?uvY(q.y):k);for(let i=0;i<N;i++){const A=j*cols+i,B=j*cols+(i+1)%N;if(k===0)idx.push(c,A,B);else idx.push(c,B,A);}});}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  // flip winding if normals face inward (rings go around +y consistently)
  return g;}
function sliceAt(S,y){if(y>=S[0].y)return S[0];for(let i=1;i<S.length;i++){if(y>=S[i].y){const A=S[i-1],B=S[i],t=(A.y-y)/(A.y-B.y||1);return{y,a:lerp(A.a,B.a,t),b:lerp(A.b,B.b,t),z0:lerp(A.z0||0,B.z0||0,t),x0:lerp(A.x0||0,B.x0||0,t)};}}return S[S.length-1];}
// a tube along a path with varying radius and round caps; update() rewrites vertices in place
class Tube{constructor(nPath=14,nRad=12,caps=3){this.nP=nPath;this.nR=nRad;this.caps=caps;this.rings=nPath+caps*2;
  const g=new T.BufferGeometry();const vc=this.rings*nRad+2;g.setAttribute('position',new T.BufferAttribute(new Float32Array(vc*3),3));const idx=[];
  for(let j=0;j<this.rings-1;j++)for(let i=0;i<nRad;i++){const a=j*nRad+i,b=j*nRad+(i+1)%nRad,c=(j+1)*nRad+i,d=(j+1)*nRad+(i+1)%nRad;idx.push(a,b,c,b,d,c);}
  const s0=this.rings*nRad,s1=s0+1;for(let i=0;i<nRad;i++){idx.push(s0,(i+1)%nRad,i);const L=(this.rings-1)*nRad;idx.push(s1,L+i,L+(i+1)%nRad);}
  g.setIndex(idx);this.geo=g;}
  update(pts,rad){const nP=this.nP,nR=this.nR,P=this.geo.attributes.position.array;const tang=[];
    for(let k=0;k<nP;k++){const a=pts[Math.max(0,k-1)],b=pts[Math.min(nP-1,k+1)];tang.push(b.clone().sub(a).normalize());}
    let nrm=Math.abs(tang[0].y)<.9?V3(0,1,0).cross(tang[0]).normalize():V3(1,0,0).cross(tang[0]).normalize();
    const frames=[];for(let k=0;k<nP;k++){if(k>0){const ax=tang[k-1].clone().cross(tang[k]);const s=ax.length();if(s>1e-6){ax.normalize();const ang=Math.asin(clamp(s,-1,1));nrm.applyAxisAngle(ax,ang);}}const bin=tang[k].clone().cross(nrm).normalize();frames.push([nrm.clone(),bin]);}
    const rings=[];const c=this.caps;
    for(let i=c;i>=1;i--){const ang=i/c*Math.PI/2;rings.push({p:pts[0].clone().addScaledVector(tang[0],-rad[0]*Math.sin(ang)*.9),r:rad[0]*Math.cos(ang),f:frames[0]});}
    for(let k=0;k<nP;k++)rings.push({p:pts[k],r:rad[k],f:frames[k]});
    for(let i=1;i<=c;i++){const ang=i/c*Math.PI/2;rings.push({p:pts[nP-1].clone().addScaledVector(tang[nP-1],rad[nP-1]*Math.sin(ang)*.9),r:rad[nP-1]*Math.cos(ang),f:frames[nP-1]});}
    let o=0;rings.forEach(R=>{for(let i=0;i<nR;i++){const t=i/nR*TAU,cs=Math.cos(t),sn=Math.sin(t);P[o++]=R.p.x+(R.f[0].x*cs+R.f[1].x*sn)*R.r;P[o++]=R.p.y+(R.f[0].y*cs+R.f[1].y*sn)*R.r;P[o++]=R.p.z+(R.f[0].z*cs+R.f[1].z*sn)*R.r;}});
    const a=rings[0].p,b=rings[rings.length-1].p;P[o++]=a.x;P[o++]=a.y;P[o++]=a.z;P[o++]=b.x;P[o++]=b.y;P[o++]=b.z;
    this.geo.attributes.position.needsUpdate=true;this.geo.computeVertexNormals();this.geo.computeBoundingSphere();}}
function bendPath(s,j,e,n,bend=.6){const m=s.clone().add(e).multiplyScalar(.5);const c=m.clone().add(j.clone().sub(m).multiplyScalar(1+bend));const o=[];for(let k=0;k<n;k++){const t=k/(n-1),u=1-t;o.push(s.clone().multiplyScalar(u*u).addScaledVector(c,2*u*t).addScaledVector(e,t*t));}return o;}
function ik3(s,t,a,b,pole){const d=t.clone().sub(s);let dist=clamp(d.length(),Math.abs(a-b)+1e-4,a+b-1e-4);const dn=d.clone().normalize();
  const pd=pole.clone().sub(dn.clone().multiplyScalar(pole.dot(dn))).normalize();const cosA=clamp((a*a+dist*dist-b*b)/(2*a*dist),-1,1),sinA=Math.sqrt(1-cosA*cosA);
  return{joint:s.clone().addScaledVector(dn,a*cosA).addScaledVector(pd,a*sinA),end:s.clone().addScaledVector(dn,dist)};}
function ell(rx,ry,rz,col,ink=1,seg=20){const g=new T.SphereGeometry(1,seg,Math.round(seg*.7));g.scale(rx,ry,rz);return withInk(new T.Mesh(g,toon(col)),ink);}

// ---------------- 3D hands ----------------
// fingers: [baseX, baseZ, length, radius]; pose: curl 0..1 per finger, thumb in/out, pinch
function makeHand(col,scale=1,inkW=1){
  const g=new T.Group();const palm=ell(.045,.05,.022,col,inkW);palm.position.set(0,-.045,0);g.add(palm);
  const F=[[-.03,.0,.055,.0115],[-.01,.004,.063,.012],[.011,.004,.06,.0118],[.03,0,.048,.0105]];
  const fingers=F.map(([x,z,L,r])=>{const root=new T.Group();root.position.set(x,-.09,z);const s1=new T.Group();root.add(s1);
    const c1=withInk(new T.Mesh(new T.CapsuleGeometry(r,L*.5,4,8),toon(col)),inkW);c1.position.y=-L*.28;s1.add(c1);
    const s2=new T.Group();s2.position.y=-L*.55;s1.add(s2);const c2=withInk(new T.Mesh(new T.CapsuleGeometry(r*.92,L*.4,4,8),toon(col)),inkW);c2.position.y=-L*.22;s2.add(c2);
    g.add(root);return{root,s1,s2,L};});
  const th=new T.Group();th.position.set(-.042,-.05,.02);const t1=withInk(new T.Mesh(new T.CapsuleGeometry(.013,.035,4,8),toon(col)),inkW);t1.position.y=-.025;th.add(t1);
  const th2=new T.Group();th2.position.y=-.05;th.add(th2);const t2=withInk(new T.Mesh(new T.CapsuleGeometry(.012,.028,4,8),toon(col)),inkW);t2.position.y=-.02;th2.add(t2);g.add(th);
  g.scale.setScalar(scale);
  g.userData={fingers,th,th2,pose(curl=0,spread=0,thumb=0,pinch=0,grip=false){fingers.forEach((f,i)=>{const c=i===0?(grip?pinch*.55:Math.max(curl,pinch*.55)):curl;f.root.rotation.x=c*1.25;f.s2.rotation.x=c*1.35;f.root.rotation.z=(i-1.5)*spread*.18;});
    th.rotation.set(.5*thumb+pinch*.9,0,-.5+thumb*.4+pinch*.35);th2.rotation.x=pinch*.5;}};
  return g;}
// the point between the thumb tip and the index tip (hand-local), used for pinching
function pinchPoint(hand){hand.updateMatrixWorld(true);const a=V3(0,-.045,0);hand.userData.th2.localToWorld(a);const b=V3(0,-.06,0);hand.userData.fingers[0].s2.localToWorld(b);return a.add(b).multiplyScalar(.5);}

// ---------------- face texture (drawn in angle/height space, wraps around the head) ----------------
const FW=1024,FH=424,FPX=163/47; // canvas px per head-px at the front
function faceCanvas(){const c=document.createElement('canvas');c.width=FW;c.height=FH;return c;}
function drawFace(ctx,spec,st){
  const S=spec.skin,F=spec.face||{},X=al=>FW/2+al*163,Y=y=>(y+66)*FPX,ink='#231a22';
  ctx.fillStyle=S;ctx.fillRect(0,0,FW,FH);
  const kid=spec.age==='kid',ey=kid?8:4,ea=.37;
  const blush=(al)=>{ctx.fillStyle='rgba(240,132,138,.5)';ctx.beginPath();ctx.ellipse(X(al),Y(22),26,20,0,0,TAU);ctx.fill();};
  blush(-.62);blush(.62);
  const brush=(pts,w,col)=>{ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.beginPath();pts.forEach(([a,y],i)=>i?ctx.lineTo(X(a),Y(y)):ctx.moveTo(X(a),Y(y)));ctx.stroke();};
  const look=st.look||[0,0];
  [-1,1].forEach(sd=>{const al=sd*ea;
    if(st.blink||st.expr==='happy'){brush(st.blink?[[al-.18,ey],[al,ey+3],[al+.18,ey]]:[[al-.18,ey+3],[al,ey-7],[al+.18,ey+3]],11,ink);return;}
    const wide=st.expr==='surprised';const rx=.33*163*(wide?1.12:1),ry=19*FPX*(wide?1.15:1);
    ctx.fillStyle='#fff';ctx.strokeStyle=ink;ctx.lineWidth=9;ctx.beginPath();ctx.ellipse(X(al),Y(ey),rx,ry,0,0,TAU);ctx.fill();ctx.stroke();

const HL={

  messy:al=>{const c=Math.cos(al);return c>0?lerp(0,-22,c)+6*Math.sin(al*14):lerp(0,32,-c);},
  sidepart:al=>{const c=Math.cos(al);return c>0?lerp(0,-30,Math.pow(c,1.2))+(al>-.2&&al<.7?10*Math.sin((al+.2)*3.4):0):lerp(0,32,-c);},

  long:al=>{const c=Math.cos(al);return c>0?lerp(34,-36,Math.pow(c,2.2)):lerp(34,50,-c);},
  bob:al=>{const c=Math.cos(al);return c>0?lerp(30,-14,Math.pow(c,1.6)):lerp(30,44,-c);},
  ponytail:al=>{const c=Math.cos(al);return c>0?lerp(4,-34,Math.pow(c,1.4)):lerp(4,22,-c);},

<script type="text/plain" id="app-toonkit">

// A shot is JSON: actors (CharacterSpec + start), beats (actor does a named MOVE from the library),

(function(){

const collarPoint=C=>C.rig3d?Rig3D.collarPoint(C):Toon3D.collarPoint(C);
const E={linear:x=>x,inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,back:x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}};

  idle:{doc:'Stand and breathe with a slow weight shift and blinks.',params:{},loop:true,f(c){const{P,R,tau}=c;P.pelvisH-=Math.abs(Math.sin(tau*1.9))*.012;P.spine=[.02*Math.sin(tau*1.9),.03*Math.sin(tau*.7)];P.head=[.1*Math.sin(tau*.6),0,.04*Math.sin(tau*.7)];}},
  walk:{doc:'Walk to a floor point at a steady pace, turning to face it.',params:{to:'[x, z] floor point',speed:'m/s (default 1.3)'},travel:true,dur:c=>{const d=Math.hypot(c.p.to[0]-c.start.pos.x,c.p.to[1]-c.start.pos.z);return d/(c.p.speed||1.3);},
    f(c){gait(c,c.p.speed||1.3,1);}},
  run:{doc:'Run to a floor point, leaning forward with big arm swings.',params:{to:'[x, z]',speed:'m/s (default 3.4)'},travel:true,dur:c=>Math.hypot(c.p.to[0]-c.start.pos.x,c.p.to[1]-c.start.pos.z)/(c.p.speed||3.4),f(c){gait(c,c.p.speed||3.4,2);}},
  jump:{doc:'Anticipation crouch, stretched jump, squash on landing, spring settle.',params:{height:'metres (default .7)'},dur:()=>1.4,f(c){const{P,R,tau}=c;const h=c.p.height||.7;

    else{const s=tau-.85;P.squash=1-spr(s,.3,15,5.5);P.pelvisH-=Math.max(0,spr(s,.22,11,4.5))*R.leg;P.expr='happy';}}},
  'drop-in':{doc:'Falls into frame from above, legs first: legs stretch ~1.6x and touch down before the body, then squash and spring.',params:{from_height:'metres above the floor (default 3.2)',stretch:'leg stretch (default 1.6)'},dur:()=>1.9,
    f(c){const{P,R,tau}=c;const st=c.p.stretch||1.6,T1=.7,T2=.95;

      else{const s=tau-T2;P.squash=1-spr(s,.34,15,5.5);P.pelvisH=R.leg-.02-Math.max(-.04,spr(s+.05,.3,11,4.5))*R.leg*.9;const arm=spr(s,.5,9,3.5);P.hands.L.y+=.1+arm*.9;P.hands.R.y+=.1+arm*.9;P.expr=s<.8?'happy':'normal';}}},
  land:{doc:'Big squash on contact then a springy settle (use after a fall).',params:{squash:'0..0.5 (default .38)'},dur:()=>1.1,f(c){const{P,R,tau}=c;P.squash=1-spr(tau,c.p.squash||.38,15,5.5);P.pelvisH-=Math.max(0,spr(tau+.05,.28,11,4.5))*R.leg;const a=spr(tau,.5,9,3.5);P.hands.L.y+=.1+a*.8;P.hands.R.y+=.1+a*.8;}},
  wave:{doc:'Wave hello with one hand: elbow out at shoulder height, forearm up, palm forward, swaying from the elbow; happy face.',params:{hand:'"right" | "left"'},dur:()=>1.6,loop:true,f(c){const{P,R,tau}=c;const k=c.p.hand==='left'?'L':'R',sd=k==='L'?1:-1;const w=E.out(seg(tau,0,.28));
    const shY=R.leg+R.torso-.05,sway=Math.sin(tau*11)*w;
    P.hands[k]=P.hands[k].clone().lerp(V3(sd*(R.sw+R.upper*.92+sway*.1),shY+R.fore*.82,.1+Math.abs(sway)*.02),w);

    P.handPose[k]=[.06,.7,.1,0];P.expr='happy';P.head=[-sd*.1*w,.02,sd*.05*w];P.spine=[0,-sd*.04*w];}},
  point:{doc:'Point at a world point with the nearer hand (index finger out, arm straight) and look at it.',params:{at:'[x, y, z]',hand:'"right" | "left" (default: the side the point is on)'},dur:()=>1.5,f(c){const{P,R,tau}=c;const at=vec(c.p.at||[2,1.4,0]);const local=at.clone().sub(c.root.pos).applyAxisAngle(V3(0,1,0),-c.root.yaw);
    const k=c.p.hand==='left'?'L':c.p.hand==='right'?'R':(local.x>=0?'L':'R'),sd=k==='L'?1:-1;const w=E.back(seg(tau,0,.3));P.handPoint={[k]:1};P.armPole={[k]:V3(sd*.3,-1,-.3)};const dir=local.clone().sub(V3(sd*R.sw,R.leg+R.torso,0)).normalize();
    P.hands[k]=P.hands[k].clone().lerp(V3(sd*R.sw,R.leg+R.torso-.05,0).addScaledVector(dir,R.upper+R.fore-.05),w);P.handPose[k]=[.9,0,.4,0];P.head=[clamp(Math.atan2(local.x,local.z),-.9,.9)*w,-.2*w];P.look=[Math.sign(local.x)*w,-.3*w];}},
  shrug:{doc:'Elbows in, forearms out, palms up, head tilted.',params:{},dur:()=>1.4,f(c){const{P,R,tau}=c;const w=E.back(seg(tau,0,.3))*(1-seg(tau,1.1,1.4));P.hands.L.lerp(V3(R.sw+R.fore*.75,R.leg+R.torso*.62,.2),w);P.hands.R.lerp(V3(-R.sw-R.fore*.75,R.leg+R.torso*.62,.2),w);P.armPole={L:V3(.25,-1,-.35),R:V3(-.25,-1,-.35)};P.handTwist={L:1.6*w,R:1.6*w};P.handPose={L:[.1,.9,.2,0],R:[.1,.9,.2,0]};P.head=[0,.08*w,.15*w];P.expr='normal';P.spine=[0,0];}},
  cheer:{doc:'Arms up with little celebration hops.',params:{},dur:()=>2,loop:true,f(c){const{P,R,tau}=c;const b=Math.abs(Math.sin(tau*6));c.root.pos.y=c.start.pos.y+b*.12;P.squash=1+(b-.5)*.1;P.hands.L.set(R.sw+.22,R.leg+R.torso+.4,.1);P.hands.R.set(-R.sw-.22,R.leg+R.torso+.4,.1);P.handPose={L:[.9,0,.4,0],R:[.9,0,.4,0]};P.expr='happy';}},
  surprised:{doc:'A cartoon take: tiny anticipation squash, then a stretched pop with wide eyes and an "o" mouth.',params:{},dur:()=>1.3,f(c){const{P,R,tau}=c;if(tau<.12){P.squash=1-.15*tau/.12;P.pelvisH-=.05;}else{const s=tau-.12;P.squash=1+spr(s,.22,14,4);c.root.pos.y=c.start.pos.y+Math.max(0,spr(s,.12,7,6));P.hands.L.set(R.sw+.4,R.leg+R.torso*.9,.2);P.hands.R.set(-R.sw-.4,R.leg+R.torso*.9,.2);P.handPose={L:[0,1,0,0],R:[0,1,0,0]};}P.expr='surprised';P.mouth='o';}},
  'look-at':{doc:'Turn the head (and eyes) toward a world point.',params:{at:'[x, y, z]'},dur:()=>1.2,f(c){const{P}=c;const at=vec(c.p.at||[0,3,0]);const local=at.clone().sub(c.root.pos).applyAxisAngle(V3(0,1,0),-c.root.yaw);const w=E.out(seg(c.tau,0,.35));const up=Math.atan2(local.y-1.5,Math.hypot(local.x,local.z));
    P.head=[clamp(Math.atan2(local.x,local.z),-1,1)*w,clamp(-up,-.7,.5)*w];P.look=[Math.sign(local.x)*w,clamp(-up*1.5,-1,1)*w];}},
  dance:{doc:'A bouncy groove on the beat: bob, hip sway, arms pumping.',params:{bpm:'beats per minute (default 120)'},dur:()=>4,loop:true,f(c){const{P,R,tau}=c;const b=(c.p.bpm||120)/60*Math.PI;const s=Math.sin(tau*b);P.pelvisH-=Math.abs(s)*.08;P.spine=[.05,.12*s];P.head=[.2*s,.05,-.1*s];
    P.hands.L.set(R.sw+.2,R.leg+R.torso*.6+Math.max(0,s)*.35,.25);P.hands.R.set(-R.sw-.2,R.leg+R.torso*.6+Math.max(0,-s)*.35,.25);P.handPose={L:[.9,0,.4,0],R:[.9,0,.4,0]};P.feet.L.y+=Math.max(0,s)*.1;P.feet.R.y+=Math.max(0,-s)*.1;P.expr='happy';}},
  spin:{doc:'Spin in place with arms out.',params:{turns:'number (default 1)'},dur:c=>.9*(c.p.turns||1),f(c){const{P,R,tau,dur}=c;c.root.yaw=c.start.yaw+E.inOut(clamp(tau/dur))*TAU*(c.p.turns||1);P.hands.L.set(R.sw+.4,R.leg+R.torso*.8,0);P.hands.R.set(-R.sw-.4,R.leg+R.torso*.8,0);P.handPose={L:[0,1,0,0],R:[0,1,0,0]};P.expr='happy';}},
  'turn-to':{doc:'Turn the whole body to face a floor point.',params:{at:'[x, z]'},dur:()=>.6,f(c){const to=V3(c.p.at[0],0,c.p.at[1]);c.root.yaw=lerp(c.start.yaw,face(c.start.pos,to),E.inOut(clamp(c.tau/.6)));}},
  dangle:{doc:'Hanging from the collar (used while a prop holds the actor): limp legs, flailing arms, worried face.',params:{},loop:true,dur:()=>2,f(c){const{P,R,tau}=c;P.spine=[.28,0];P.feet.L.y-=.05;P.feet.R.y-=.05;const fl=Math.sin(tau*14);P.hands.L.set(R.sw+.3,R.leg+R.torso*.95+fl*.12,.18);P.hands.R.set(-R.sw-.3,R.leg+R.torso*.95-fl*.12,.18);P.handPose={L:[0,1,0,0],R:[0,1,0,0]};P.head=[Math.sin(tau*2.3)*.35,.25];P.look=[Math.sin(tau*2.3),.4];P.expr='surprised';}},
  kick:{doc:'Kick the legs in the air (pairs with dangle).',params:{},loop:true,dur:()=>2,f(c){MOVES.dangle.f(c);const{P,R,tau}=c;const ph=tau*10.5;P.feet.L.set(R.hw*.5,.02+Math.max(0,Math.sin(ph))*.22,.08+Math.sin(ph)*.2);P.feet.R.set(-R.hw*.5,.02+Math.max(0,Math.sin(ph+Math.PI))*.22,.08+Math.sin(ph+Math.PI)*.2);P.expr=Math.floor(tau*1.5)%2?'angry':'surprised';}},
  talk:{doc:'Chatty talking: mouth flaps, small gestures.',params:{},loop:true,dur:()=>2,f(c){const{P,R,tau}=c;P.mouth=['open','smile','o','grin','open'][Math.floor(tau*9)%5];P.hands.R.set(-R.sw-.2,R.leg+R.torso*.4+Math.sin(tau*5)*.08,.3);P.handPose.R=[.1,.6,0,0];P.head=[.1*Math.sin(tau*2),0,.05*Math.sin(tau*3)];}},
};
const TAU=Math.PI*2;
function gait(c,speed,kind){const{P,R,tau}=c;const to=V3(c.p.to[0],0,c.p.to[1]);const from=c.start.pos.clone();const dist=Math.hypot(to.x-from.x,to.z-from.z);const d=Math.min(dist,tau*speed);
  const dir=dist>1e-3?V3(to.x-from.x,0,to.z-from.z).normalize():V3(0,0,1);c.root.pos.copy(from).addScaledVector(dir,d);c.root.yaw=Math.atan2(dir.x,dir.z);
  const moving=d<dist-1e-3;const ph=tau*speed*(kind===2?2.6:3.2);const amp=moving?1:0;const step=(kind===2?.32:.2)*amp;
  P.feet.L.set(R.hw*.55,.07+Math.max(0,Math.sin(ph))*.14*amp*(kind===2?1.6:1),Math.cos(ph)*step);P.feet.R.set(-R.hw*.55,.07+Math.max(0,Math.sin(ph+Math.PI))*.14*amp*(kind===2?1.6:1),Math.cos(ph+Math.PI)*step);
  P.pelvisH-=Math.abs(Math.sin(ph))*.035*amp;c.root.pos.y=0;P.spine=[(kind===2?.28:.05)*amp,0];
  P.hands.L.z=Math.cos(ph+Math.PI)*(kind===2?.35:.18)*amp+.05;P.hands.R.z=Math.cos(ph)*(kind===2?.35:.18)*amp+.05;if(kind===2){P.hands.L.y+=.15;P.hands.R.y+=.15;P.handPose={L:[.9,0,.4,0],R:[.9,0,.4,0]};P.expr='happy';}}

// ---------------- camera library ----------------
const CAMERA={
  set:{doc:'Cut: place the camera instantly.',params:{pos:'[x,y,z]',look:'[x,y,z] or actor id',fov:'degrees'}},
  move:{doc:'Glide to a new position / target / lens over dur seconds.',params:{pos:'[x,y,z]',look:'[x,y,z] or actor id',fov:'degrees',ease:'linear | inOut | out | in | back'}},
  'push-in':{doc:'Move toward the target by a factor of the distance (0.5 = halfway).',params:{amount:'0..0.9',ease:'...'}},
  'pull-out':{doc:'Move away from the target by a factor (1 = double the distance).',params:{amount:'0..3',ease:'...'}},
  orbit:{doc:'Circle around the target by an angle, keeping height and distance.',params:{angle:'degrees (+ = counter-clockwise)',ease:'...'}},
  follow:{doc:'Keep looking at an actor (with an offset) for dur seconds.',params:{actor:'id',offset:'[x,y,z] look offset (default [0,1.1,0])'}},
  'dolly-zoom':{doc:'The "vertigo" move: push in while widening the lens so the subject stays the same size.',params:{amount:'-0.8..0.8 (+ = push in)'}},
  shake:{doc:'A decaying camera shake (impacts).',params:{amp:'metres (default .05)'}},
};
// ---------------- props, fx ----------------
const PROPS={'giant-hand':{doc:'A 10× hand that reaches in, pinches an actor by the jacket collar, lifts, drops or exits.',actions:{enter:'{actor} hover above the actor',grab:'{actor} pinch the collar (the actor dangles from here on)',lift:'{dy} raise by dy metres',lower:'{dy}',drop:'{} let go (actor falls to the floor)',exit:'{} leave the frame'},params:{scale:'default 10',color:'skin hex (default: actor skin)'}}};
const FX={impact:{doc:'Anime impact flash (two frames).'},dust:{doc:'Dust puffs at an actor\'s feet.'},'speed-lines':{doc:'Streaks: "down" for falls, "radial" for zooms.',params:{dir:'down | radial'}},exclaim:{doc:'A popping "!" over an actor\'s head.'},sweat:{doc:'Nervous sweat drops.'},stars:{doc:'Dizzy stars circling the head.'},hearts:{doc:'Floating hearts.'}};

// ---------------- validation (clear errors the AI can fix) ----------------
function validate(shot){const errs=[];if(!shot||typeof shot!=='object')return['The shot must be a JSON object.'];
  const ids=new Set((shot.actors||[]).map(a=>a.id));if(!ids.size)errs.push('Add at least one actor: {"id":"kai","preset":"Kai","at":[0,0]}.');
  (shot.beats||[]).forEach((b,i)=>{if(b.actor&&!ids.has(b.actor))errs.push(`beats[${i}]: unknown actor "${b.actor}".`);if(b.do&&!MOVES[b.do])errs.push(`beats[${i}]: unknown move "${b.do}". Moves: ${Object.keys(MOVES).join(', ')}.`);
    if((b.do==='walk'||b.do==='run')&&!(b.params&&Array.isArray(b.params.to)))errs.push(`beats[${i}]: ${b.do} needs params.to [x, z].`);});
  (shot.camera||[]).forEach((b,i)=>{if(!CAMERA[b.move])errs.push(`camera[${i}]: unknown camera move "${b.move}". Moves: ${Object.keys(CAMERA).join(', ')}.`);});
  (shot.props||[]).forEach((b,i)=>{if(!PROPS[b.prop])errs.push(`props[${i}]: unknown prop "${b.prop}".`);else if(!PROPS[b.prop].actions[b.action])errs.push(`props[${i}]: ${b.prop} has no action "${b.action}". Actions: ${Object.keys(PROPS[b.prop].actions).join(', ')}.`);});
  (shot.fx||[]).forEach((b,i)=>{if(!FX[b.fx])errs.push(`fx[${i}]: unknown fx "${b.fx}". FX: ${Object.keys(FX).join(', ')}.`);});
  return errs;}

// ---------------- the director ----------------
class Director{
  constructor(scene,presets){this.scene=scene;this.presets=presets;this.actors={};this.hands={};}
  load(shot){this.clear();this.shot=JSON.parse(JSON.stringify(shot));const S=this.shot;S.beats=(S.beats||[]).slice().sort((a,b)=>a.t-b.t);S.camera=(S.camera||[]).slice().sort((a,b)=>a.t-b.t);S.props=(S.props||[]).slice().sort((a,b)=>a.t-b.t);S.fx=S.fx||[];
    (S.actors||[]).forEach(a=>{const spec=a.spec||this.presets[a.preset]||Object.values(this.presets)[0];const C=buildCharacter({species:'human',...spec});this.scene.add(C.root);
      const beats=S.beats.filter(b=>b.actor===a.id);const start={pos:V3(a.at?a.at[0]:0,0,a.at?a.at[1]:0),yaw:(a.facing||0)*Math.PI/180};
      // chain start states: each beat starts where the previous move ended

    <div class="row"><h3>Camera moves</h3><div class="moves">${Object.entries(K.CAMERA).map(([k,m])=>`<div class="mv"><b>${k}</b><span>${m.doc}</span></div>`).join('')}</div></div>
    <div class="row"><h3>Props &amp; FX</h3><div class="moves">${[...Object.entries(K.PROPS),...Object.entries(K.FX)].map(([k,m])=>`<div class="mv"><b>${k}</b><span>${m.doc}</span></div>`).join('')}</div></div>`;
    S.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{moveSel=b.dataset.mv;loadShot(moveShot());renderSide();});}
  if(mode==='shots'){S.innerHTML=`<div class="row"><h3>Example shots</h3><select id="ex">${Object.keys(EXAMPLES).map(k=>`<option>${k}</option>`).join('')}</select></div>
    <div class="row"><h3>Shot script</h3><textarea id="src" spellcheck="false" aria-label="Shot script JSON"></textarea><div style="display:flex;gap:6px"><button class="btn primary" id="run">Run shot</button><button class="btn" id="copy">Copy</button></div><div class="errs" id="errs"></div></div>
    <details><summary>AI tools (what the model is given)</summary><pre id="tools"></pre></details><details><summary>Library catalogue (list_toon_library)</summary><pre id="cat"></pre></details>`;
    const src=S.querySelector('#src');const setEx=k=>{src.value=JSON.stringify(EXAMPLES[k],null,1);run();};
    const run=()=>{let s;try{s=JSON.parse(src.value);}catch(e){$('errs').innerHTML=`<div>JSON error: ${e.message}</div>`;return;}const errs=K.validate(s);
      $('errs').innerHTML=errs.length?errs.map(e=>`<div>${e.replace(/</g,'&lt;')}</div>`).join(''):`<span class="ok">Valid · ${s.actors.length} actor(s), ${(s.beats||[]).length} beats, ${(s.camera||[]).length} camera moves</span>`;if(!errs.length){loadShot(s);playing=true;$('play').textContent='Pause';}};
    S.querySelector('#ex').onchange=e=>setEx(e.target.value);S.querySelector('#run').onclick=run;
    S.querySelector('#copy').onclick=()=>{try{navigator.clipboard.writeText(src.value).catch(()=>src.select());}catch(e){src.select();}};
    S.querySelector('#tools').textContent=JSON.stringify(K.TOOLS,null,1);S.querySelector('#cat').textContent=JSON.stringify(K.catalog(),null,1);setEx(Object.keys(EXAMPLES)[0]);}
}
function rebuild(){if(mode==='char')loadShot(charShot());else if(mode==='moves')loadShot(moveShot());renderSide();}
$('modes').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$('modes').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  $('hint').textContent=mode==='char'?'Drag to orbit · move the pointer and they look at it':mode==='moves'?'Click a move to preview it · drag to orbit':'Scripts use only library names, which is what the AI writes';
  if(mode==='char')loadShot(charShot());if(mode==='moves')loadShot(moveShot());renderSide();});
$('home').onclick=()=>{};
// ---------- stage interaction ----------
let drag=null;stage.addEventListener('pointerdown',e=>{if(mode==='shots')return;drag={x:e.clientX,y:e.clientY,yaw:orbit.yaw,pitch:orbit.pitch};stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();look.x=clamp((e.clientX-r.left)/r.width*2-1,-1,1);look.y=clamp((e.clientY-r.top)/r.height*2-1,-1,1);look.on=true;
  if(drag){orbit.yaw=drag.yaw-(e.clientX-drag.x)*.008;orbit.pitch=clamp(drag.pitch+(e.clientY-drag.y)*.004,-.1,.8);}});
stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointerleave',()=>{drag=null;look.on=false;});
stage.addEventListener('wheel',e=>{if(mode==='shots')return;e.preventDefault();orbit.dist=clamp(orbit.dist*(1+e.deltaY*.001),1.6,12);},{passive:false});
// ---------- 2D FX on twos ----------
function scr(v){const p=v.clone().project(cam);return[(p.x*.5+.5)*fx.width,(-p.y*.5+.5)*fx.height];}
function headOf(id){const A=D.actors[id]||Object.values(D.actors)[0];const v=V3();A.C.head.getWorldPosition(v);return v;}
function footOf(id){const A=D.actors[id]||Object.values(D.actors)[0];return A.C.root.position.clone();}
function drawFX(t,dw){const W=fx.width,H=fx.height,s=W/1280;fxc.clearRect(0,0,W,H);const rnd=i=>{const x=Math.sin(i*127.1+dw*311.7)*43758.5453;return x-Math.floor(x);};const ink='rgba(35,20,33,';
  for(const b of fxBeats){const d=b.dur||(b.fx==='impact'?.17:b.fx==='dust'?.65:1);const u=(t-b.t)/d;if(u<0||u>1)continue;const p=b.params||{};
    if(b.fx==='speed-lines'){const[cx,cy]=scr(headOf(b.actor));for(let i=0;i<24;i++){fxc.strokeStyle=ink+(.2+rnd(i+3)*.3)+')';fxc.lineWidth=(1.5+rnd(i+7)*3)*s;fxc.beginPath();
      if(p.dir==='radial'){const a=rnd(i)*Math.PI*2,r0=Math.max(W,H)*(.45+rnd(i+50)*.2),r1=r0*(.72+rnd(i+9)*.1);fxc.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);fxc.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);}
      else{const x=cx+(rnd(i)-.5)*W*.5,y0=rnd(i+30)*H*.7,L=H*(.12+rnd(i+9)*.22);fxc.moveTo(x,y0);fxc.lineTo(x,y0+L);}fxc.stroke();}}
    if(b.fx==='impact'){fxc.fillStyle=`rgba(255,255,255,${u<.5?.75:.35})`;fxc.fillRect(0,0,W,H);}
    if(b.fx==='dust'){const[x,y]=scr(footOf(b.actor));for(let i=0;i<7;i++){const a=Math.PI+(i/6)*Math.PI;const dd=(40+u*150)*s*(.7+rnd(i)*.5);const r=(24+rnd(i+2)*18)*s*(1-u*.6);fxc.beginPath();fxc.arc(x+Math.cos(a)*dd*1.3,y+Math.sin(a)*dd*.25-6*s,r,0,Math.PI*2);fxc.fillStyle=`rgba(250,244,255,${.95*(1-u)})`;fxc.fill();fxc.lineWidth=2.5*s;fxc.strokeStyle=ink+(1-u)+')';fxc.stroke();}}
    if(b.fx==='exclaim'){const[x,y]=scr(headOf(b.actor).add(V3(.18,.36,0)));const k=s*(1+Math.max(0,.25-u*d)*3);fxc.save();fxc.translate(x,y);fxc.rotate(.18);fxc.font=`800 ${Math.round(64*k)}px Fredoka, Inter, sans-serif`;fxc.textAlign='center';fxc.lineWidth=8*k;fxc.strokeStyle='#231421';fxc.strokeText('!',0,0);fxc.fillStyle='#FFD34D';fxc.fillText('!',0,0);fxc.restore();}
    if(b.fx==='sweat'){const[x,y]=scr(headOf(b.actor).add(V3(-.2,.12,.1)));[0,1].forEach(k=>{const dy=((t*1.6+k*.5)%1)*40*s;const px=x-k*22*s,py=y+dy;fxc.beginPath();fxc.moveTo(px,py-14*s);fxc.quadraticCurveTo(px+9*s,py,px,py+6*s);fxc.quadraticCurveTo(px-9*s,py,px,py-14*s);fxc.fillStyle='#8FD3FF';fxc.fill();fxc.lineWidth=2.4*s;fxc.strokeStyle='#231421';fxc.stroke();});}
    if(b.fx==='stars'){const[x,y]=scr(headOf(b.actor).add(V3(0,.3,0)));for(let i=0;i<4;i++){const a=t*4+i*Math.PI/2;const px=x+Math.cos(a)*50*s,py=y+Math.sin(a)*14*s;star(px,py,11*s);}}
    if(b.fx==='hearts'){const[x,y]=scr(headOf(b.actor).add(V3(0,.35,0)));for(let i=0;i<3;i++){const k=((t*.8+i/3)%1);heart(x+(i-1)*34*s+Math.sin(t*3+i)*8*s,y-k*90*s,(12+6*(1-k))*s,1-k);}}}}
function star(x,y,r){fxc.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;fxc.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}fxc.closePath();fxc.fillStyle='#FFD34D';fxc.fill();fxc.lineWidth=2;fxc.strokeStyle='#231421';fxc.stroke();}
function heart(x,y,r,a){fxc.globalAlpha=a;fxc.beginPath();fxc.moveTo(x,y+r*.9);fxc.bezierCurveTo(x-r*1.6,y-r*.1,x-r*.8,y-r*1.3,x,y-r*.4);fxc.bezierCurveTo(x+r*.8,y-r*1.3,x+r*1.6,y-r*.1,x,y+r*.9);fxc.fillStyle='#F07AA8';fxc.fill();fxc.lineWidth=2;fxc.strokeStyle='#231421';fxc.stroke();fxc.globalAlpha=1;}
// ---------- loop ----------
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const dur=shot?shot.duration||8:8;if(playing){tNow+=dt;if(tNow>dur)tNow=mode==='char'?tNow:0;}
  const dw=Math.floor(tNow*12),tp=twos?dw/12:tNow;
  if(!twos||dw!==lastDrawing||mode==='char'){
    if(mode==='char'){const A=D.actors.a;D.override=look.on?{head:[look.x*.9,look.y*.45],look:[look.x,look.y]}:null;}else D.override=null;
    D.apply(tp);shared.seed.value=dw%97;lastDrawing=dw;drawFX(tp,dw);}
  if(mode==='shots'){const c=D.cameraAt(tNow);cam.position.copy(c.pos);cam.fov=c.fov;cam.updateProjectionMatrix();cam.lookAt(c.look);}
  else{const A=Object.values(D.actors)[0];const c=A?A.C.root.position.clone().setY(0):V3();const tgt=c.clone().add(V3(0,.95,0));cam.fov=34;cam.updateProjectionMatrix();
    cam.position.set(tgt.x+Math.sin(orbit.yaw)*Math.cos(orbit.pitch)*orbit.dist,tgt.y+Math.sin(orbit.pitch)*orbit.dist,tgt.z+Math.cos(orbit.yaw)*Math.cos(orbit.pitch)*orbit.dist);cam.lookAt(tgt);}
  R.render(scene,cam);
  $('scrub').value=Math.round(tNow/(mode==='char'?1e9:dur)*1000);$('time').textContent=mode==='char'?'live':`${tNow.toFixed(2)} / ${dur.toFixed(1)} s`;
  $('cap').textContent=mode==='char'?specName:mode==='moves'?moveSel:'Shot';$('sub').textContent=mode==='char'?`${spec.shape} · ${spec.age} · ${spec.hair.style} hair`:mode==='moves'?(K.MOVES[moveSel].doc):'';
  requestAnimationFrame(frame);}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};
$('scrub').oninput=()=>{if(mode==='char')return;tNow=$('scrub').value/1000*(shot.duration||8);lastDrawing=-1;playing=false;$('play').textContent='Play';};
$('twos').onclick=()=>{twos=true;$('twos').classList.add('on');$('ones').classList.remove('on');};$('ones').onclick=()=>{twos=false;$('ones').classList.add('on');$('twos').classList.remove('on');};
loadShot(charShot());renderSide();resize();requestAnimationFrame(frame);
window.__studio={mode:m=>{document.querySelector(`[data-m="${m}"]`).click();},seek:t=>{tNow=t;lastDrawing=-1;playing=false;},pick:mv=>{moveSel=mv;loadShot(moveShot());renderSide();},example:k=>{const sel=document.getElementById('ex');sel.value=k;sel.onchange({target:sel});}};
})();
</script>
