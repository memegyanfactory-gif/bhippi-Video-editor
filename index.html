<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/bhippi.png" />
    <title>Bhippi Video Editor</title>
    <style>
      /* The splash below paints before the app's bundle and styles load; React replaces it. */
      html, body, #root { height: 100%; margin: 0; background: #0f0f0f; }
      .boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #767676; font: 600 13px/1 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.08em; user-select: none; animation: boot-in 240ms ease-out; }
      .boot img { filter: drop-shadow(0 10px 24px rgba(255, 170, 60, 0.28)); animation: boot-glow 1.4s ease-in-out infinite alternate; }
      @keyframes boot-in { from { opacity: 0; } }
      @keyframes boot-glow { to { filter: drop-shadow(0 10px 32px rgba(255, 170, 60, 0.5)); } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" data-tauri-drag-region>
        <img src="/bhippi.png" alt="" width="72" height="72" data-tauri-drag-region />
        <span data-tauri-drag-region>BHIPPI</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
