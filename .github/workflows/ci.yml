name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, lint & unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Unit tests (Vitest)
        run: npm run test:ui

  rust:
    name: cargo clippy & tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # `tauri::generate_context!()` reads tauri.conf.json at compile time and
      # fails if `frontendDist` ("../dist") is absent. The Rust crate therefore
      # cannot be checked on a fresh checkout without building the frontend
      # first, even though no Rust code is involved in that build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (provides ../dist for generate_context!)
        run: npm run build

      # Reports findings without failing the build. The workspace currently has
      # ~42 pre-existing clippy findings (mostly dead code and pedantic lints
      # such as too_many_arguments and type_complexity). Turning these into hard
      # errors here would only mean a permanently red badge, which hides real
      # regressions. To make clippy blocking again, fix the backlog and drop the
      # `--cap-lints` allowance below.
      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets -- --cap-lints warn

      - name: Cargo tests
        run: cargo test --workspace