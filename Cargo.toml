[workspace]
members = ["crates/bhippi-providers", "crates/bhippi-kokoro", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.10"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1.81"
chrono = { version = "0.4.38", features = ["serde"] }
futures-core = "0.3.30"
futures-util = "0.3.30"
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
thiserror = "2.0.3"
tokio = { version = "1.38.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.40"
ulid = { version = "1.1.3", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev.package."*"]
# Dependencies rarely change; optimising them keeps FFmpeg piping and JSON parsing snappy in F5 builds.
opt-level = 2
